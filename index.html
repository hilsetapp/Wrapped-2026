<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Wrapped 2026 — your year in code, no login needed</title>
  <meta name="description" content="Spotify-Wrapped for your GitHub: animated story slides, coding archetype, top languages, streaks — and a beautiful poster to share. 100% in your browser. No login, no tracking." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GitHub Wrapped 2026" />
  <meta property="og:description" content="Your year in code as a beautiful shareable story. No login — just a username." />
  <meta property="og:image" content="assets/og-banner.png" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- paper doodles backdrop -->
  <div class="doodle d-star"></div>
  <div class="doodle d-circle"></div>
  <div class="doodle d-squig"></div>
  <div class="doodle d-plus">+</div>

  <!-- ═══════════ Landing ═══════════ -->
  <main id="landing" class="landing">
    <div class="lang-switch" id="lang-switch" role="group" aria-label="language">
      <button class="lang-btn" data-lang="en" type="button">EN</button>
      <button class="lang-btn" data-lang="ru" type="button">RU</button>
    </div>

    <div class="stamp" id="badge">NO LOGIN!</div>

    <img src="assets/logo.png" alt="logo" class="logo" />

    <h1 class="title">
      <span class="t-row">GITHUB</span>
      <span class="t-row t-outline">WRAPPED</span>
      <span class="t-row t-year">2026</span>
    </h1>

    <p class="tagline">
      <span data-i18n="tagline"></span><br>
      <span data-i18n-html="tagline2"></span>
    </p>

    <form id="form" class="form" autocomplete="off">
      <input id="username" type="text" inputmode="text" placeholder="your GitHub username"
             spellcheck="false" autocapitalize="off" required />
      <button type="submit" class="btn-primary" data-i18n="wrapBtn"></button>
    </form>

    <p class="demo-line"><span data-i18n="demoLine"></span>
      <button class="chip" data-demo="sindresorhus" type="button">sindresorhus</button>
      <button class="chip" data-demo="torvalds" type="button">torvalds</button>
      <button class="chip" data-demo="hilsetapp" type="button">hilsetapp</button>
    </p>

    <p id="error" class="error" hidden></p>

    <footer class="foot">
      🔒 <span data-i18n="privacy"></span><br>
      <a class="foot-link" href="https://github.com/hilsetapp/wrapped-2026" target="_blank" rel="noopener">★ open source</a>
    </footer>
  </main>

  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <!-- ═══════════ Loading overlay ═══════════ -->
  <div id="loading" class="loading" hidden>
    <div class="loader-card">
      <div class="spinner"></div>
      <p id="loading-step">…</p>
      <div class="loading-bar"><span id="loading-fill"></span></div>
    </div>
  </div>

  <!-- ═══════════ Story viewport ═══════════ -->
  <section id="story" class="story" hidden>
    <div class="frame">
      <div id="progress" class="progress"></div>

      <div id="slides" class="slides"></div>

      <!-- invisible tap zones -->
      <button class="tap tap-left" id="tap-left" aria-label="previous slide"></button>
      <button class="tap tap-right" id="tap-right" aria-label="next slide"></button>
      <button class="close" id="btn-close" aria-label="close">✕</button>
    </div>
  </section>

  <script src="js/i18n.js"></script>
  <script src="js/github.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/poster.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
